[project]
name = "booking-backend"
version = "0.1.0"
description = "Booking service API: owner publishes meeting types, guests book free slots."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "N", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]
exclude = ["app/generated/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
