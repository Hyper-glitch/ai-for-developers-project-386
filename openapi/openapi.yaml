openapi: 3.0.0
info:
  title: Booking API
  description: Booking service API. Single source of truth for the OpenAPI spec and generated clients.
  version: 0.0.0
tags:
  - name: system
  - name: meeting-types
paths:
  /health:
    get:
      operationId: System_health
      description: Report that the service is up.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - system
  /meeting-types:
    get:
      operationId: MeetingTypes_list
      description: List the owner's meeting types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - meeting-types
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Liveness response.
    MeetingType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 120
servers:
  - url: http://localhost:8000
    description: Local development server
    variables: {}
