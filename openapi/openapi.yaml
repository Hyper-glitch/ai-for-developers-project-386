openapi: 3.0.0
info:
  title: Booking API
  description: Booking service API. Single source of truth for the OpenAPI spec and generated clients.
  version: 0.0.0
tags:
  - name: system
paths:
  /health:
    get:
      operationId: System_health
      description: Report that the service is up.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - system
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Liveness response.
servers:
  - url: http://localhost:8000
    description: Local development server
    variables: {}
