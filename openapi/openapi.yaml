openapi: 3.0.0
info:
  title: Booking API
  description: Booking service API. Single source of truth for the OpenAPI spec and generated clients.
  version: 0.0.0
tags:
  - name: system
  - name: meeting-types
paths:
  /health:
    get:
      operationId: System_health
      description: Report that the service is up.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - system
  /meeting-types:
    get:
      operationId: MeetingTypes_list
      description: List the owner's meeting types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - meeting-types
    post:
      operationId: MeetingTypes_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - meeting-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingType'
components:
  schemas:
    CreateMeetingType:
      type: object
      required:
        - title
        - description
        - durationMinutes
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        durationMinutes:
          type: number
          enum:
            - 15
            - 30
            - 45
            - 60
            - 75
            - 90
            - 105
            - 120
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        reason:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Liveness response.
    MeetingType:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
      allOf:
        - $ref: '#/components/schemas/CreateMeetingType'
servers:
  - url: http://localhost:8000
    description: Local development server
    variables: {}
